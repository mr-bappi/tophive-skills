interface:
  display_name: "Web & UI Design"
  short_description: "Websites, complex dashboards & motion experiences"
  icon_small: "./assets/icon-256.png"
  icon_large: "./assets/icon-512.png"
  brand_color: "#18303C"
  default_prompt: "Use $tophive-design for this website, application UI, dashboard, animation or 3D design request. Choose BUILD versus EXPLORE from my intent: when I ask to build, complete the working artifact without unnecessary approval pauses; verify product evidence, inspect rendered output when tools exist, fix issues, and report untested checks. Never deploy without my approval."
policy:
  allow_implicit_invocation: true
